version: "3.9"

services:

  django:

    build:
      context: .
    image: django-devops-dashboard:v1

    container_name: django-dashboard

    env_file:
      - .env

    volumes:
      - static_volume:/app/staticfiles

    expose:
      - "8000"

  nginx:

    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - static_volume:/static
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - django

volumes:

  static_volume:
