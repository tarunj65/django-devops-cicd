services:

  django:
    networks:
      - app-network

    image: tarunjuneja06/devops-repo:latest

    container_name: django-dashboard

    env_file:
      - .env

    volumes:
      - static_volume:/app/staticfiles

    expose:
      - "8000"

    restart: unless-stopped

  nginx:
    networks:
      - app-network

    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - static_volume:/static
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

    depends_on:
      - django

volumes:

  static_volume:


networks:
  
  app-network:
